function render(){
  if(STEPS[state.step] && STEPS[state.step].type!=='body_parts') selP=[];
  var app=document.getElementById('app');
  if(state.page==='email'){app.innerHTML=renderEmailPage();setupEmailPage();return}
  if(state.page==='plan'){app.innerHTML=renderPlanPage();setTimeout(function(){startTimer('planTimer',599,null);},100);return}
  var step=STEPS[state.step];
  if(!step)return;
  var showProgress=step.progress;
  var progIdx=PROGRESS_STEPS.findIndex(function(s){return s.id===step.id});
  var pct=showProgress?((progIdx+1)/PROGRESS_STEPS.length)*100:0;
  var isLoader=step.type==='loader';
  var showBack=state.step>0&&!isLoader;
  app.innerHTML='<header class="header"><button class="header-back '+(showBack?'':'hidden')+'" id="backBtn">←</button><div class="logo"><div class="logo-icon">S</div>Saúde Integrativa</div><div style="width:36px"></div></header>'+(showProgress?'<div class="progress-bar-wrap"><div class="progress-meta"><span>Seu plano personalizado</span><span style="color:var(--primary);font-weight:800">'+Math.round(pct)+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>':'')+'<main><div class="step" id="stepContent">'+renderStep(step)+'</div></main><footer><a href="#" style="color:var(--text-muted);margin-right:12px;font-size:10px">Termos de Uso</a><a href="#" style="color:var(--text-muted);font-size:10px">Privacidade</a><br><span style="font-size:10px">Os resultados podem variar. © 2026 Saúde Integrativa</span></footer>';
  var bb=document.getElementById('backBtn');

  setupStep(step);
}

function setupStep(step){
  document.querySelectorAll('[data-gender]').forEach(function(b){b.addEventListener('click',function(){state.answers.gender=b.dataset.gender;nextStep()})});
  document.querySelectorAll('[data-age]').forEach(function(b){b.addEventListener('click',function(){state.answers.age_range=b.dataset.age;nextStep()})});

  document.querySelectorAll('.option-btn[data-val]').forEach(function(b){
    if(step.type==='single')b.addEventListener('click',function(){if(step.key)state.answers[step.key]=b.dataset.val;nextStep()});
  });
  document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){state.answers[b.dataset.key]=b.dataset.val;nextStep()})});
  if(step.type==='multiple'){
    var sel=[];
    document.querySelectorAll('#multiList .option-btn').forEach(function(b){
      b.addEventListener('click',function(){
        var v=b.dataset.val;
        if(v==='none'){sel=sel.includes('none')?[]:['none']}
        else{sel=sel.filter(function(x){return x!=='none'});if(sel.includes(v))sel=sel.filter(function(x){return x!==v});else sel.push(v)}
        document.querySelectorAll('#multiList .option-btn').forEach(function(bb){
          var vv=bb.dataset.val;var on=vv==='none'?sel.includes('none'):sel.includes(vv);
          bb.classList.toggle('selected',on);var cc=bb.querySelector('[data-check]');if(cc)cc.innerHTML=on?'✓':'';
        });
        var mc=document.getElementById('multiContinue');if(mc)mc.disabled=sel.length===0;
      });
    });
    var mc=document.getElementById('multiContinue');
    if(mc)mc.addEventListener('click',function(){if(step.key)state.answers[step.key]=[].concat(sel);nextStep()});
  }
  if(step.type==='exercise_likes'){
    var exKeys=['yoga','walk','massage'];
    document.querySelectorAll('[data-like]').forEach(function(b){b.addEventListener('click',function(){
      var k=exKeys[state.exerciseSubStep];state.exerciseRatings[k]=b.dataset.like;
      if(state.exerciseSubStep<exKeys.length-1){state.exerciseSubStep++;render()}
      else{state.answers.exercise_likes=Object.assign({},state.exerciseRatings);state.exerciseSubStep=0;state.exerciseRatings={};nextStep()}
    })});
  }
  if(step.type==='calculating'){
    var calcPct=0;
    if(state.calcInterval)clearInterval(state.calcInterval);
    state.calcInterval=setInterval(function(){
      calcPct=Math.min(calcPct+0.55,100);
      var pct=Math.round(calcPct);
      var circle=document.getElementById('calcCircle');
      var pctEl=document.getElementById('calcPct');
      if(circle)circle.setAttribute('stroke-dashoffset',490-(490*(pct/100)));
      if(pctEl)pctEl.textContent=pct+'%';
      [0,1,2,3,4].forEach(function(i){
        if(pct>=(i+1)*20){
          var item=document.getElementById('calcItem'+i);
          var check=document.getElementById('calcCheck'+i);
          if(item){item.style.opacity='1';item.style.background='#fdf0ed';}
          if(check)check.textContent='✓';
        }
      });
      if(calcPct>=100){clearInterval(state.calcInterval);state.calcInterval=null;clearInterval(state.calcRevInterval);state.calcRevInterval=null;setTimeout(function(){nextStep();},800);}
    },30);
  }
  if(step.type==='loader'){
    if(state.loaderInterval)clearInterval(state.loaderInterval);
    if(state.reviewInterval)clearInterval(state.reviewInterval);
    state.loaderPct=0;
    state.reviewIndex=0;
    var totalRevs=4;
    var circ=2*Math.PI*113;
    state.loaderInterval=setInterval(function(){
      state.loaderPct=Math.min(state.loaderPct+0.5,100);
      var pct=Math.round(state.loaderPct);
      var circle=document.getElementById('loaderCircle');
      var pctText=document.getElementById('loaderPctText');
      var taskEl=document.getElementById('loaderTask');
      var tasks=['Analisando retenção líquida...','Avaliando sinais fasciais...','Cruzando respostas hormonais...','Calculando inflamação silenciosa...','Seu protocolo está pronto!'];

      if(circle){var dash=circ*(pct/100);circle.setAttribute('stroke-dashoffset',circ-dash);}
      if(pctText)pctText.textContent=pct+'%';
      if(taskEl)taskEl.textContent=tasks[ti];
      if(state.loaderPct>=100){clearInterval(state.loaderInterval);state.loaderInterval=null;setTimeout(function(){nextStep()},800);}
    },35);
    state.reviewInterval=setInterval(function(){

function startTimer(elementId, seconds, onEnd){
  var el=document.getElementById(elementId);
  if(!el)return;
  var remaining=seconds;
  var t=setInterval(function(){
    remaining--;
    if(remaining<=0){clearInterval(t);if(onEnd)onEnd();return;}
    var m=Math.floor(remaining/60),s=remaining%60;
    var el2=document.getElementById(elementId);
    if(el2)el2.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}

    if(typeof fbq!=='undefined'){fireLeadPixel(email);fireInitiateCheckout();}
    var bn=BODY_MAP[state.answers.current_body]||'2';
    var tn=TARGET_MAP[state.answers.target_body]||'3';
    var em=encodeURIComponent(email);
    fetch('/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,corpo_atual:state.answers.current_body||'',corpo_meta:state.answers.target_body||'',peso_atual:state.answers.current_weight||'',peso_meta:state.answers.target_weight||'',idade:state.answers.age||''})})
    .then(function(){window.location.href='sales-page.html?body='+bn+'&target='+tn+'&email='+em;})
    .catch(function(){window.location.href='sales-page.html?body='+bn+'&target='+tn+'&email='+em;});
  });
}

var BODY_MAP={slim:'1',mid:'2',plump:'3',over:'4'};
var TARGET_MAP={light:'1',fit:'2',smaller:'3',energy:'4'};
render();
</script>
</body>
</html>
