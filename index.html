<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Protocolo da Fáscia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#C4614A;--primary-light:#f3e8e5;--primary-dark:#a04a36;--bg:#fff;--muted:#f5f4f3;--border:#e8e5e2;--text:#1a1714;--text-muted:#7a7471;--radius:16px;--font:'Figtree',sans-serif}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;max-width:440px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
  .header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 16px;justify-content:space-between}
  .header-back{width:36px;height:36px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:20px;color:var(--text);transition:background .15s}
  .header-back:hover{background:var(--muted)}
  .header-back.hidden{opacity:0;pointer-events:none}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
  .logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
  .progress-bar-wrap{background:#fff;border-bottom:1px solid var(--border);padding:8px 16px 10px}
  .progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:6px}
  .progress-meta span:last-child{color:var(--primary)}
  .progress-track{height:5px;background:var(--muted);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
  main{flex:1;overflow-y:auto;padding:20px 16px 80px}
  footer{border-top:1px solid var(--border);padding:12px 16px;text-align:center;font-size:10px;color:var(--text-muted);background:#fff}
  .step{animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  h1.step-title{font-size:22px;font-weight:900;line-height:1.2;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:4px}
  h2.step-q{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:4px}
  .step-sub{font-size:13px;color:var(--text-muted);font-weight:500;margin-bottom:16px}
  .gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .gender-card{position:relative;overflow:hidden;border-radius:var(--radius);border:2px solid var(--border);height:220px;cursor:pointer;transition:border-color .2s,transform .1s}
  .gender-card:hover{border-color:var(--primary);transform:scale(1.01)}
  .gender-card:active{transform:scale(.98)}
  .gender-card img{width:100%;height:100%;object-fit:cover;object-position:top}
  .gender-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 60%)}
  .gender-card-label{position:absolute;bottom:0;left:0;right:0;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:10px 12px;height:42px;color:#fff;font-weight:700;font-size:15px}
  .age-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .age-card{position:relative;overflow:hidden;border-radius:var(--radius);border:2px solid var(--border);height:170px;cursor:pointer;transition:border-color .2s,transform .1s;background:#f0eeec;display:flex;align-items:center;justify-content:center}
  .age-card:hover{border-color:var(--primary)}
  .age-card:active{transform:scale(.98)}
  .age-card img{width:85%;height:90%;object-fit:contain;object-position:center;display:block;margin:0 auto}
  .age-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 60%)}
  .age-card-label{position:absolute;bottom:0;left:0;right:0;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;height:40px;color:#fff;font-weight:800;font-size:17px}
  .options-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .option-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:#fff;cursor:pointer;text-align:left;font-family:var(--font);font-size:15px;font-weight:600;color:var(--text);transition:border-color .15s,background .15s,transform .1s}
  .option-btn:hover{border-color:var(--primary);background:var(--primary-light)}
  .option-btn:active{transform:scale(.98)}
  .option-emoji{font-size:22px;flex-shrink:0}
  .option-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
  .option-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .option-btn.selected .option-check{background:var(--primary);border-color:var(--primary);color:#fff}
  .info-image{width:100%;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;position:relative;margin-bottom:16px}
  .info-image img{width:100%;height:100%;object-fit:cover}
  .info-image-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 50%)}
  .info-image-title{position:absolute;bottom:0;left:0;right:0;padding:20px;color:#fff;font-size:19px;font-weight:900;line-height:1.2}
  .info-image-title span{color:#FFD700}
  .info-text{color:var(--text-muted);font-size:14px;line-height:1.6;margin-bottom:12px}
  .info-text span{color:var(--primary);font-weight:700}
  .body-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .body-type-card{border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .2s,transform .1s;display:flex;flex-direction:column}
  .body-type-card:hover{border-color:var(--primary)}
  .body-type-card:active{transform:scale(.97)}
  .body-svg-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;color:rgba(100,80,75,.35);height:140px}
  .body-type-card:hover .body-svg-wrap{color:rgba(196,97,74,.5)}
  .body-type-label{background:var(--primary);color:#fff;text-align:center;padding:10px 8px;font-size:13px;font-weight:700}
  .body-parts-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .body-part-btn{display:flex;align-items:center;gap:6px;padding:10px;border-radius:12px;border:2px solid var(--border);background:#fff;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;transition:all .15s}
  .body-part-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
  .body-part-btn:active{transform:scale(.96)}
  .loader-wrap{text-align:center;padding:20px 0}
  .loader-track{height:12px;background:var(--muted);border-radius:99px;overflow:hidden;margin:12px 0 6px}
  .loader-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .1s linear}
  .review-card{background:var(--muted);border-radius:16px;padding:16px;margin-top:16px}
  .review-name{font-weight:700;font-size:14px}
  .review-time{font-size:11px;color:var(--text-muted)}
  .review-stars{color:#F59E0B;font-size:13px}
  .review-title{font-weight:700;font-size:13px;color:var(--primary);margin:6px 0 4px}
  .review-text{font-size:12px;color:var(--text-muted);font-style:italic;line-height:1.5}
  .gauge-track{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;position:relative}
  .gauge-seg{flex:1}
  .gauge-needle{position:absolute;top:-4px;width:20px;height:20px;background:#fff;border:2.5px solid var(--text);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:translateX(-50%);transition:left 1s cubic-bezier(.4,0,.2,1)}
  .gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:6px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .stat-box{background:var(--muted);border-radius:12px;padding:12px 8px;text-align:center}
  .stat-label{font-size:11px;color:var(--text-muted)}
  .stat-val{font-weight:800;font-size:14px;margin-top:4px}
  .goal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .goal-tag{display:flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
  .social-hero{position:relative;border-radius:var(--radius);overflow:hidden;height:280px;margin-bottom:16px}
  .social-hero img{width:100%;height:100%;object-fit:contain;object-position:center bottom;background:#e8e4e0}
  .social-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.1) 50%)}
  .social-hero-content{position:absolute;bottom:0;left:0;right:0;padding:16px;color:#fff}
  .social-avatars{display:flex;align-items:center;margin-bottom:8px}
  .social-avatar{width:30px;height:30px;border-radius:50%;border:2px solid #fff;object-fit:cover;margin-left:-8px}
  .social-avatar:first-child{margin-left:0}
  .social-count{font-size:12px;font-weight:700;margin-left:8px;opacity:.9}
  .social-hero-title{font-size:21px;font-weight:900;line-height:1.2}
  .social-hero-title span{color:#FFD700}
  .stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .stat-item{background:var(--muted);border-radius:12px;padding:10px 6px;text-align:center}
  .stat-num{font-size:16px;font-weight:900;color:var(--primary)}
  .stat-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
  .chart-wrap{background:var(--muted);border-radius:16px;padding:16px;margin:12px 0}
  .chart-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;color:var(--text-muted)}
  .chart-legend-dot{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  .unit-toggle{display:flex;background:var(--muted);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
  .unit-btn{flex:1;padding:10px;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-muted);transition:all .2s}
  .unit-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(196,97,74,.3)}
  .number-input-wrap{position:relative}
  .number-input{width:100%;height:60px;border:2px solid var(--border);border-radius:14px;font-family:var(--font);font-size:24px;font-weight:800;text-align:center;background:#fff;color:var(--text);outline:none;transition:border-color .2s;padding-right:40px}
  .number-input:focus{border-color:var(--primary)}
  .input-unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--text-muted);font-size:16px}
  .error-msg{color:#e53e3e;font-size:13px;margin-top:6px}
  .info-box{display:flex;gap:10px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:12px;margin:12px 0}
  .info-box-title{font-size:13px;font-weight:700;color:#1E40AF}
  .info-box-text{font-size:12px;color:#3B82F6;margin-top:3px}
  .retention-box{border-radius:12px;border:1px solid;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:flex-start}
  .exercise-card{background:linear-gradient(to bottom,var(--primary-light),var(--muted));border-radius:20px;padding:40px 20px;text-align:center;margin:16px 0}
  .exercise-emoji{font-size:72px;line-height:1}
  .exercise-title{font-size:24px;font-weight:900;margin:12px 0 4px}
  .exercise-desc{font-size:14px;color:var(--text-muted)}
  .like-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .like-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;border:2px solid;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;transition:all .15s;background:#fff}
  .like-btn.hate{border-color:#FCA5A5;color:#DC2626}
  .like-btn.hate:hover{background:#FEE2E2}
  .like-btn.neutral{border-color:#D1D5DB;color:#4B5563}
  .like-btn.neutral:hover{background:#F3F4F6}
  .like-btn.love{border-color:#86EFAC;color:#16A34A}
  .like-btn.love:hover{background:#DCFCE7}
  .like-btn:active{transform:scale(.95)}
  .substep-dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
  .substep-dot{height:5px;flex:1;border-radius:99px;background:var(--muted);transition:background .3s}
  .substep-dot.done{background:var(--primary)}
  .date-input{width:100%;height:54px;border:2px solid var(--border);border-radius:14px;font-family:var(--font);font-size:16px;font-weight:600;padding:0 16px;outline:none;color:var(--text);background:#fff;transition:border-color .2s}
  .date-input:focus{border-color:var(--primary)}
  .email-input{width:100%;height:56px;border:2px solid var(--border);border-radius:14px;font-family:var(--font);font-size:16px;font-weight:500;padding:0 16px;outline:none;color:var(--text);background:#fff;transition:border-color .2s;margin:8px 0}
  .email-input:focus{border-color:var(--primary)}
  .review-hero{position:relative;border-radius:var(--radius);overflow:hidden;height:280px;margin-bottom:16px}
  .review-hero img{width:100%;height:100%;object-fit:contain;background:#f5f2ef;object-position:center}
  .review-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%)}
  .review-hero-content{position:absolute;bottom:0;left:0;right:0;padding:16px}
  .review-badge{display:inline-flex;align-items:center;background:rgba(196,97,74,.9);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:8px}
  .review-hero-title{color:#fff;font-size:22px;font-weight:900;line-height:1.2}
  .review-block{background:var(--muted);border-radius:16px;padding:16px;margin-bottom:12px}
  .reviewer-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .reviewer-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(196,97,74,.3)}
  .reviewer-name{font-weight:700;font-size:14px}
  .stars{color:#F59E0B;font-size:14px}
  .review-quote{font-size:13px;color:var(--text-muted);font-style:italic;line-height:1.55}
  .features-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .feature-box{background:var(--muted);border-radius:12px;padding:12px 8px;text-align:center}
  .feature-icon{font-size:22px;margin-bottom:4px}
  .feature-label{font-size:12px;font-weight:700}
  .btn-primary{width:100%;height:54px;border-radius:99px;background:var(--primary);color:#fff;border:none;font-family:var(--font);font-size:16px;font-weight:800;cursor:pointer;transition:background .2s,transform .1s;box-shadow:0 4px 16px rgba(196,97,74,.35);margin-top:16px}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-primary:active{transform:scale(.98)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{width:100%;height:44px;border-radius:99px;background:transparent;color:var(--text-muted);border:none;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
  .btn-ghost:hover{color:var(--text)}
  .plan-hero{text-align:center;padding:20px 0 12px}
  .offer-card{background:var(--primary-light);border:2px solid rgba(196,97,74,.25);border-radius:18px;padding:16px;margin:16px 0}
  .feature-list{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .feature-item{display:flex;align-items:flex-start;gap:12px;background:var(--muted);border-radius:14px;padding:14px 12px}
  .feature-item-icon{font-size:22px;flex-shrink:0}
  .feature-item-title{font-weight:700;font-size:14px}
  .feature-item-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
  .chart-features{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .chart-feature{display:flex;align-items:center;gap:10px;background:var(--muted);border-radius:12px;padding:12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
var state={page:'quiz',step:0,answers:{},exerciseSubStep:0,exerciseRatings:{},loaderPct:0,loaderInterval:null,reviewIndex:0,reviewInterval:null};
var STEPS=[
  {id:'gender',type:'gender',progress:false},
  {id:'age_range',type:'age_range',progress:false},
  {id:'social_proof',type:'social_proof',progress:false},
  {id:'goals',type:'multiple',progress:true,label:'O que mais incomoda você hoje?',sub:'Selecione tudo que se aplica:',btn:'Continuar',key:'goals',opts:[{l:'Barriga inchada',v:'barriga',e:'💧'},{l:'Pernas pesadas',v:'pernas',e:'🦵'},{l:'Retenção de líquido',v:'retencao',e:'💦'},{l:'Cansaço constante',v:'cansaco',e:'😴'},{l:'Corpo inflamado',v:'corpo',e:'🔥'},{l:'Dificuldade para emagrecer',v:'emagrecer',e:'⚖️'}]},
  {id:'tried',type:'single',progress:true,label:'Você já tentou resolver o inchaço antes?',key:'tried',opts:[{l:'Sim, tentei várias coisas',v:'yes',e:'✅'},{l:'Não, é a primeira vez',v:'no',e:'❌'}]},
  {id:'info1',type:'info',progress:false,label:'Soltar a fáscia é o caminho mais <span>inteligente depois dos 35</span>',btn:'Continuar',img:'https://raw.githubusercontent.com/leyjosboutique-rgb/protocolo-fascia-quiz/main/info1.webp',imgM:'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=800&h=600&q=80',subs:['Seu plano é baseado na sua fase hormonal, rotina e áreas de inchaço. <span>É simples de seguir e funciona em 7 minutos por dia.</span>','<span>Sem academia. Sem dieta. Sem sofrimento.</span> Feito para o seu corpo agora.']},
  {id:'current_body',type:'body_type',progress:true,kind:'current'},
  {id:'target_body',type:'body_type',progress:true,kind:'target'},
  {id:'limits',type:'multiple',progress:true,label:'Você tem alguma dessas limitações?',sub:'Selecione tudo que se aplica:',btn:'Continuar',key:'limits',opts:[{l:'Dor lombar',v:'lombar',e:'🔙'},{l:'Joelho sensível',v:'joelho',e:'🦵'},{l:'Dor no pescoço ou ombros',v:'pescoco',e:'💪'},{l:'Nenhuma das anteriores',v:'none',e:'✅'}]},
  {id:'body_parts',type:'body_parts',progress:true},
  {id:'review_info',type:'review_info',progress:false},
  {id:'typical_day',type:'single',progress:true,label:'Como é o seu dia típico?',key:'day',opts:[{l:'Fico sentada a maior parte do dia',v:'sitting',e:'💻'},{l:'Faço pausas ativas',v:'breaks',e:'🚶'},{l:'Fico em pé o dia todo',v:'standing',e:'🏃'}]},
  {id:'work',type:'single',progress:true,label:'Qual é a sua rotina de trabalho?',key:'work',opts:[{l:'Horário fixo (9 às 18h)',v:'fixed',e:'🕐'},{l:'Horários flexíveis',v:'flex',e:'🔄'},{l:'Turno da noite',v:'night',e:'🌙'},{l:'Aposentada / não trabalho',v:'retired',e:'🏡'}]},
  {id:'energy',type:'single',progress:true,label:'Como está sua energia durante o dia?',key:'energy',opts:[{l:'Cansada o tempo todo',v:'low',e:'😴'},{l:'Queda após o almoço',v:'lunch',e:'😪'},{l:'Cansada antes das refeições',v:'before',e:'😤'},{l:'Energia constante',v:'high',e:'😊'}]},
  {id:'info2',type:'info',progress:false,label:'<span>Desinchar em casa</span> de forma leve e sem sofrimento',btn:'Continuar',img:'https://raw.githubusercontent.com/leyjosboutique-rgb/protocolo-fascia-quiz/main/info2.webp',imgM:'https://raw.githubusercontent.com/leyjosboutique-rgb/protocolo-fascia-quiz/main/info2.webp',subs:['Seu plano é personalizado para sua rotina, seus horários e <span>sua fase hormonal.</span>','Seja iniciante ou voltando a se cuidar — vamos te ajudar a <span>sentir o corpo mais leve, ter mais energia e se reconhecer no espelho novamente.</span>']},
  {id:'exercise',type:'single',progress:true,label:'Com que frequência você se movimenta?',key:'exercise',opts:[{l:'Nunca',v:'never',bar:'none'},{l:'Algumas vezes por mês',v:'month',bar:'low'},{l:'Algumas vezes por semana',v:'week',bar:'medium'},{l:'Quase todos os dias',v:'daily',bar:'high'}]},
  {id:'minutes',type:'single',progress:true,label:'Quantos minutos por dia você consegue dedicar?',key:'minutes',opts:[{l:'Até 7 minutos',v:'7',e:'✌️'},{l:'10-15 minutos',v:'15',e:'3️⃣'},{l:'20-30 minutos',v:'30',e:'4️⃣'},{l:'Mais de 30 minutos',v:'30plus',e:'🖐️'}]},
  {id:'exercise_likes',type:'exercise_likes',progress:true},

function render(){
  var app=document.getElementById('app');
  if(state.page==='email'){app.innerHTML=renderEmailPage();setupEmailPage();return}
  if(state.page==='plan'){app.innerHTML=renderPlanPage();return}
  var step=STEPS[state.step];
  if(!step)return;
  var showProgress=step.progress;
  var progIdx=PROGRESS_STEPS.findIndex(function(s){return s.id===step.id});
  var pct=showProgress?((progIdx+1)/PROGRESS_STEPS.length)*100:0;
  var isLoader=step.type==='loader';
  var showBack=state.step>0&&!isLoader;
  app.innerHTML='<header class="header"><button class="header-back '+(showBack?'':'hidden')+'" id="backBtn">←</button><div class="logo"><div class="logo-icon">S</div>Saúde Integrativa</div><div style="width:36px"></div></header>'+(showProgress?'<div class="progress-bar-wrap"><div class="progress-meta"><span>Seu plano</span><span>'+(progIdx+1)+'/'+PROGRESS_STEPS.length+'</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>':'')+'<main><div class="step" id="stepContent">'+renderStep(step)+'</div></main><footer><a href="#" style="color:var(--text-muted);margin-right:12px;font-size:10px">Termos de Uso</a><a href="#" style="color:var(--text-muted);font-size:10px">Privacidade</a><br><span style="font-size:10px">Os resultados podem variar. © 2026 Saúde Integrativa</span></footer>';
  var bb=document.getElementById('backBtn');

  setupStep(step);
}
